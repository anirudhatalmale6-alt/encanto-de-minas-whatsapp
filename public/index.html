<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encanto de Minas - Pao de Queijo Artesanal</title>
  <style>
    :root {
      --dark-red: #8B1A1A;
      --deep-red: #6B1414;
      --warm-beige: #F5F0E8;
      --gold: #C8A84E;
      --gold-light: #D4B85C;
      --text-dark: #2C1810;
      --white: #FFFFFF;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--warm-beige);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      max-width: 480px;
      padding: 40px 32px;
    }

    .logo-text {
      font-size: 42px;
      font-weight: 800;
      color: var(--dark-red);
      margin-bottom: 4px;
      letter-spacing: 1px;
      line-height: 1.1;
    }

    .subtitle {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: var(--gold);
      font-weight: 600;
      margin-bottom: 32px;
    }

    .tagline {
      font-size: 18px;
      color: var(--text-dark);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .tagline-sub {
      font-size: 14px;
      color: #6B5B4F;
      margin-bottom: 32px;
    }

    .qr-frame {
      background: var(--white);
      border-radius: 20px;
      padding: 28px;
      display: inline-block;
      box-shadow: 0 8px 32px rgba(139, 26, 26, 0.12);
      margin-bottom: 24px;
      border: 2px solid var(--gold);
    }

    .qr-frame img {
      width: 280px;
      height: 280px;
      display: block;
    }

    .scan-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--dark-red);
      color: var(--white);
      padding: 12px 28px;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 24px;
      letter-spacing: 0.3px;
    }

    .scan-label .arrow {
      font-size: 20px;
    }

    .instructions {
      font-size: 13px;
      color: #6B5B4F;
      line-height: 1.7;
    }

    .instructions strong {
      color: var(--text-dark);
    }

    .divider {
      width: 60px;
      height: 2px;
      background: var(--gold);
      margin: 20px auto;
    }

    .footer {
      font-size: 11px;
      color: #9B8B7F;
      margin-top: 20px;
    }

    .whatsapp-icon {
      width: 20px;
      height: 20px;
      vertical-align: middle;
    }

    @media print {
      body { background: white; }
      .container { padding: 20px; }
      .qr-frame { box-shadow: none; border: 2px solid var(--gold); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-text">Encanto de Minas</div>
    <div class="subtitle">Pao de Queijo Artesanal</div>

    <div class="tagline">Experimente nosso pao de queijo!</div>
    <div class="tagline-sub">Escaneie o QR Code para participar da degustacao</div>

    <div class="qr-frame">
      <img id="qrImage" src="" alt="QR Code WhatsApp">
    </div>

    <div class="scan-label">
      <span class="arrow">&#x1F4F1;</span>
      Aponte a camera e escaneie
    </div>

    <div class="divider"></div>

    <div class="instructions">
      <strong>1.</strong> Abra a camera do celular<br>
      <strong>2.</strong> Aponte para o QR Code<br>
      <strong>3.</strong> Faca seu cadastro pelo WhatsApp<br>
      <strong>4.</strong> Receba seu codigo e experimente!
    </div>

    <div class="divider"></div>

    <div class="footer">
      <svg class="whatsapp-icon" viewBox="0 0 24 24" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      (34) 99805-3310
    </div>
  </div>

  <script>
    async function loadQR() {
      try {
        const resp = await fetch('/qrcode/data');
        const data = await resp.json();
        document.getElementById('qrImage').src = data.qr;
      } catch (err) {
        // Fallback to direct image endpoint
        document.getElementById('qrImage').src = '/qrcode';
      }
    }
    loadQR();
  </script>
</body>
</html>
